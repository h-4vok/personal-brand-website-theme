{{ $author := site.Params.authorbox }}
{{ with $author }}
  <div class="author-box">
    {{ with .image }}<div class="author-image"><img src="{{ . | absURL }}" alt="{{ $author.name }}" loading="lazy"></div>{{ end }}
    <div class="author-info">
      <h4 class="author-name">{{ .name }}</h4>
      <div class="author-social">
        {{ range site.Params.footer.socialLinks }}
          {{ if eq (lower .name) "linkedin" }}<a href="{{ .link | safeURL }}" target="_blank" rel="noopener">{{ .name }}</a>{{ end }}
        {{ end }}
      </div>
    </div>
  </div>
{{ end }}
